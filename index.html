<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JAYPRATAP GAMING 🎮</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#080b14;color:white}
header{text-align:center;padding:25px;background:#121936}
h1{color:#00eaff}
nav{display:flex;gap:8px;overflow:auto;padding:10px;background:#111522}
nav button,.btn{padding:11px 16px;border:0;border-radius:12px;background:#202943;color:white}
section{display:none;padding:18px}
section.active{display:block}
.card{background:#151b2e;padding:20px;margin:12px 0;border-radius:18px}
.stat{font-size:20px;line-height:2}
.big{font-size:32px;font-weight:bold;color:#00ffb3}
.btn{background:#00c8ff;color:#001018;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>🎮 JAYPRATAP GAMING</h1>
<p>🔥 Play • Earn • Compete 🔥</p>
</header>

<nav>
<button onclick="show('home')">🏠 Home</button>
<button onclick="show('games')">🎮 Games</button>
<button onclick="show('rewards')">🎁 Rewards</button>
<button onclick="show('profile')">👤 Profile</button>
</nav>

<section id="home" class="active">
<div class="card">
<h2>🔥 Welcome Gamer!</h2>
<div class="stat">
💎 Gems: <b id="gems">5</b><br>
🪙 Coins: <b id="coins">0</b><br>
⚡ XP: <b id="xp">0</b>
</div>
</div>
</section>

<section id="games">
<div class="card">
<h2>🎮 Gem Game</h2>
<p>हर Play पर XP और Coins मिलेंगे।</p>
<div class="big" id="score">0</div>
<br>
<button class="btn" onclick="playGame()">⚡ PLAY</button>
</div>
</section>

<section id="rewards">
<div class="card">
<h2>🎁 Daily Gem Reward</h2>
<p>आज का reward:</p>
<div class="big">💎 +1 Gem</div>
<br>
<button class="btn" onclick="claimGem()">💎 CLAIM GEM</button>
<p id="message"></p>
</div>
</section>

<section id="profile">
<div class="card">
<h2>👤 JAYPRATAP</h2>
<div class="stat">
💎 Gems: <b id="gems2">5</b><br>
🪙 Coins: <b id="coins2">0</b><br>
⚡ XP: <b id="xp2">0</b>
</div>
</div>
</section>

<script>
let gems=Number(localStorage.getItem("gems") ?? 5);
let coins=Number(localStorage.getItem("coins") ?? 0);
let xp=Number(localStorage.getItem("xp") ?? 0);
let score=Number(localStorage.getItem("score") ?? 0);

function save(){
localStorage.setItem("gems",gems);
localStorage.setItem("coins",coins);
localStorage.setItem("xp",xp);
localStorage.setItem("score",score);

document.querySelectorAll("#gems,#gems2").forEach(x=>x.textContent=gems);
document.querySelectorAll("#coins,#coins2").forEach(x=>x.textContent=coins);
document.querySelectorAll("#xp,#xp2").forEach(x=>x.textContent=xp);
document.getElementById("score").textContent=score;
}

function show(id){
document.querySelectorAll("section").forEach(x=>x.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function playGame(){
score+=10;
xp+=10;
coins+=5;
save();
alert("🔥 +10 XP | 🪙 +5 Coins");
}

function claimGem(){
let today=new Date().toDateString();
let last=localStorage.getItem("gemClaim");

if(last===today){
document.getElementById("message").textContent="❌ आज का Gem पहले ही ले चुके हो!";
return;
}

gems++;
localStorage.setItem("gemClaim",today);
save();
document.getElementById("message").textContent="🎉 +1 Gem मिल गया!";
}

save();
</script>

</body>
</html>
